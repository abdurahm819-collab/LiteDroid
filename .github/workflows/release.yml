name: Build and publish LiteDroid

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build LiteDroid 1.5
        run: gradle --no-daemon assembleDebug

      - name: Prepare release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LiteDroid-1.5.apk

      - name: Publish LiteDroid 1.5
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5
          name: LiteDroid 1.5
          body: |
            LiteDroid 1.5

            - Tests common search offset values and stops when the API ignores them.
            - Reads APK filenames and SHA-256 hashes from the signed F-Droid index.
            - Verifies the repository index signer and downloaded APK checksum before installation.
            - Loads screenshots only from the app's official screenshot gallery.
            - Keeps downloads on the official F-Droid repository.
            - Opens Android's system package installer for user confirmation.
          files: LiteDroid-1.5.apk
          make_latest: true
