name: Build and publish LiteDroid

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build LiteDroid 1.2
        run: gradle --no-daemon assembleDebug

      - name: Prepare release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LiteDroid-1.2.apk

      - name: Publish LiteDroid 1.2
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2
          name: LiteDroid 1.2
          body: |
            LiteDroid 1.2

            - Uses the official F-Droid full-text search API.
            - Searches only when you enter a query; does not download the full repository index.
            - Reduces memory use and avoids the previous startup loading hang.
            - Targets Android API 35.
          files: LiteDroid-1.2.apk
          make_latest: true
