name: Build and publish LiteDroid

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v1.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build LiteDroid 1.1
        run: gradle --no-daemon assembleDebug

      - name: Prepare release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LiteDroid-1.1.apk

      - name: Publish LiteDroid 1.1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1
          name: LiteDroid 1.1
          body: |
            LiteDroid 1.1

            - Uses the official F-Droid v2 repository index for the live app catalogue.
            - Reads app metadata and developer links from F-Droid.
            - Targets Android API 35 to remove the old-target compatibility warning on current Android versions.
          files: LiteDroid-1.1.apk
          make_latest: true
