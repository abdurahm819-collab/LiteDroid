name: Build and publish LiteDroid

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build LiteDroid 1.3
        run: gradle --no-daemon assembleDebug

      - name: Prepare release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LiteDroid-1.3.apk

      - name: Publish LiteDroid 1.3
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3
          name: LiteDroid 1.3
          body: |
            LiteDroid 1.3

            - Keeps the official F-Droid search experience.
            - Adds an app details screen with description and available screenshots.
            - Finds the current APK from the official F-Droid app page.
            - Downloads APKs with Android Download Manager.
            - Opens Android's system package installer for user confirmation.
            - Recycles search rows and keeps a small bounded image cache.
          files: LiteDroid-1.3.apk
          make_latest: true
